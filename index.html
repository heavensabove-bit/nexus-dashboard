<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS 3.0 | Productivity Command Center</title>
<style>
:root {
  --bg:#090b13;--panel:#111522;--panel2:#171c2b;
  --line:#282e42;--text:#eef0ff;--muted:#9098b1;
  --accent:#9270ff;--accent2:#67ceff;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 75% 0%,#36245b44,transparent 40%),radial-gradient(ellipse at 0% 100%,#173c6040,transparent 40%),var(--bg);color:var(--text);font:14px "Segoe UI",Arial,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}
button,a{ -webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}
.app{display:flex;min-height:100vh}
.sidebar{width:225px;flex-shrink:0;border-right:1px solid var(--line);padding:25px 15px;background:#0b0e18eF;display:flex;flex-direction:column;z-index:3}
.brand{display:flex;align-items:center;gap:11px;padding:5px 8px 35px;font-size:21px;font-weight:850;letter-spacing:3px}
.brand-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#536dff);box-shadow:0 0 24px #9270ff44;color:white;font-size:22px}
.brand span{color:var(--accent)}
.label{font-size:10px;color:#727d98;letter-spacing:2px;font-weight:800;padding:15px 12px 10px}
.nav{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;margin-bottom:5px;width:100%;transition:.2s}
.nav:hover,.nav.active{color:white;background:linear-gradient(90deg,#9270ff24,#67ceff08);border-color:#9270ff25}
.nav .ico{width:21px;text-align:center;font-size:17px}
.sidebar-foot{margin-top:auto;padding:18px 10px 5px;color:var(--muted);font-size:11px;line-height:2}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#63e6ad;margin-right:7px;box-shadow:0 0 9px #63e6ad}
main{min-width:0;flex:1;padding:26px clamp(18px,4vw,55px);max-width:1600px;margin:auto;width:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:40px}
.crumb{font-size:12px;color:var(--muted)}.crumb strong{color:var(--text)}
.top-right{display:flex;align-items:center;gap:13px}.clock{text-align:right;font-size:12px;line-height:1.8;color:var(--muted)}
.avatar{width:37px;height:37px;display:grid;place-items:center;border-radius:12px;border:1px solid #9270ff66;background:#9270ff16}
.hero{position:relative;overflow:hidden;padding:10px 0 24px;animation:rise .5s ease both}
.hero:after{content:"";position:absolute;width:200px;height:200px;border:1px solid #9270ff12;border-radius:50%;right:5%;top:-110px;box-shadow:0 0 0 30px #9270ff06,0 0 0 60px #9270ff04;pointer-events:none}
.eyebrow{font-size:10px;letter-spacing:3px;font-weight:800;color:var(--accent2);margin-bottom:15px}
h1{font-size:clamp(32px,4.5vw,51px);letter-spacing:-2px;line-height:1.12;margin:0 0 14px}
.gradient{background:linear-gradient(100deg,#b9a5ff,var(--accent2));background-clip:text;-webkit-background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:13px;line-height:1.8}
.search{max-width:800px;display:flex;align-items:center;gap:12px;padding:8px 9px 8px 16px;border:1px solid #343650;background:#111522dd;border-radius:13px;margin:8px 0 30px;transition:.2s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 25px #9270ff18}
.search .glass{font-size:22px;color:#b5a6ff}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:white;padding:10px 0}
.search input::placeholder{color:#737d96}
.btn{border:1px solid #9270ff55;background:#9270ff18;color:#d8ceff;padding:10px 14px;border-radius:9px;transition:.2s}
.btn:hover{background:#9270ff36;transform:translateY(-1px)}
.btn.primary{color:white;border:0;background:linear-gradient(120deg,var(--accent),#647bff)}
.btn.danger{color:#ff9cae;border-color:#ff657633;background:#ff657310}
.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:30px 0 16px}
.heading h2{font-size:16px;margin:0 0 6px}.heading p{margin:0;font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.card{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;min-height:130px;padding:16px;text-decoration:none;color:var(--text);background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:13px;transition:transform .2s,border-color .2s;animation:rise .35s ease both}
.card:after{content:"";position:absolute;width:90px;height:90px;right:-55px;top:-55px;background:var(--glow,var(--accent));opacity:.15;filter:blur(27px)}
.card:hover{transform:translateY(-4px);border-color:var(--accent)}
.card-icon{width:40px;height:40px;display:grid;place-items:center;border:1px solid #9270ff35;border-radius:11px;background:#9270ff18;font-size:20px;margin-bottom:13px}
.card-title{font-weight:700;font-size:13px;margin-bottom:6px;overflow-wrap:anywhere}
.card-desc{font-size:10px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.card-actions{display:flex;gap:6px;margin-top:12px;position:relative;z-index:1}
.small-btn{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:#090b13;color:#c6cbe0;font-size:10px}
.small-btn:hover{border-color:var(--accent)}
.feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.feature,.panel{padding:20px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(130deg,var(--panel2),var(--panel));min-width:0}
.feature h3,.panel h3{font-size:14px;margin:0 0 10px}.feature p{font-size:11px;color:var(--muted);line-height:1.8;margin:0 0 15px}
.page{animation:rise .35s ease both}.page-intro{margin:0 0 24px}
.page-intro h1{font-size:32px;letter-spacing:-1px;margin-bottom:10px}
.field{width:100%;background:#090c15;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:12px;margin:7px 0 13px}
textarea.field{resize:vertical;min-height:220px;line-height:1.7}
.form-row{display:flex;gap:10px;flex-wrap:wrap}.form-row>*{flex:1;min-width:130px}
.empty{padding:35px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;line-height:1.9}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}
.stat{padding:16px;border:1px solid var(--line);border-radius:12px;background:#111522}.stat strong{display:block;font-size:23px;margin-bottom:5px}.stat span{font-size:11px;color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:20px 0}
footer{text-align:center;color:#667089;font-size:10px;padding:35px 0 15px}
#toast{position:fixed;right:22px;bottom:22px;z-index:20;background:#17192a;border:1px solid var(--accent);border-radius:11px;padding:13px 18px;max-width:calc(100vw - 44px);opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:translateY(0)}
.modal-back{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:10}
.modal{width:min(450px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:23px;box-shadow:0 20px 90px #0008}
.modal h2{font-size:18px;margin:0 0 8px}.modal p{font-size:12px;color:var(--muted);line-height:1.6}
.hidden{display:none!important}
body.light{--bg:#edf0f8;--panel:#fff;--panel2:#f8f9ff;--line:#d9deeb;--text:#1a2033;--muted:#667089}
body.light .sidebar{background:#f7f8fdee}body.light .search,body.light .field{background:#fff;color:var(--text)}body.light .search input{color:var(--text)}body.light .small-btn{background:#fff;color:var(--text)}body.light .stat{background:#fff}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.sidebar{width:190px}}
@media(max-width:700px){.sidebar{width:64px;padding:20px 7px}.brand{padding:4px 5px 30px}.brand-name,.label,.nav-label,.sidebar-foot{display:none}.nav{justify-content:center;padding:12px 4px}.sidebar .brand-mark{flex-shrink:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.feature-grid{grid-template-columns:1fr}main{padding:20px 15px}.topbar{margin-bottom:27px}.stats{grid-template-columns:1fr}.hero:after{right:-100px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* NEXUS ULTIMATE VISUAL UPGRADE 2.1 */

:root {
  --bg: #070711;
  --panel: #0e1020;
  --panel2: #15162b;
  --line: #292747;
  --text: #f2f0ff;
  --muted: #9b9bb9;
  --accent: #a477ff;
  --accent2: #57d8ff;
}

html {
  scroll-behavior: smooth;
  color-scheme: dark;
}

body {
  background:
    radial-gradient(ellipse at 15% 15%, #6529b52b, transparent 38%),
    radial-gradient(ellipse at 85% 30%, #155fc52a, transparent 38%),
    radial-gradient(ellipse at 50% 100%, #47118a22, transparent 45%),
    var(--bg);
  background-attachment: fixed;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: .24;
  background-image:
    linear-gradient(#a477ff0a 1px, transparent 1px),
    linear-gradient(90deg, #a477ff0a 1px, transparent 1px);
  background-size: 42px 42px;
  mask-image: linear-gradient(to bottom, black, transparent 85%);
  animation: nexus-grid-drift 28s linear infinite;
}

.app {
  position: relative;
  z-index: 1;
}

.sidebar {
  background: #090a16d9;
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border-right-color: #9a77ff26;
  box-shadow: 8px 0 45px #00000012;
}

.brand {
  letter-spacing: 4px;
}

.brand-mark {
  border: 1px solid #c3a7ff70;
  background: linear-gradient(135deg, #a477ff, #4c56e9 70%, #38bdf8);
  box-shadow: 0 0 25px #8855ff42, inset 0 1px #ffffff50;
  animation: nexus-mark-pulse 4s ease-in-out infinite;
}

.brand span {
  color: var(--accent2);
}

.nav {
  position: relative;
  overflow: hidden;
  border-radius: 11px;
  transition:
    color .22s ease,
    background .22s ease,
    border-color .22s ease,
    transform .22s ease;
}

.nav:hover {
  transform: translateX(3px);
  background: linear-gradient(90deg, #a477ff1c, #57d8ff0a);
  border-color: #a477ff35;
}

.nav.active {
  color: #ffffff;
  background: linear-gradient(100deg, #a477ff2b, #57d8ff10);
  border-color: #a477ff55;
  box-shadow: inset 3px 0 var(--accent), 0 0 22px #8555ff0c;
}

.nav.active .ico {
  color: var(--accent2);
}

.sidebar-foot {
  border-top: 1px solid #a477ff1b;
}

main {
  position: relative;
}

.topbar {
  padding-bottom: 15px;
  border-bottom: 1px solid #a477ff16;
}

.avatar {
  border-color: #a477ff66;
  background: linear-gradient(135deg, #a477ff22, #57d8ff12);
  box-shadow: 0 0 22px #a477ff16;
}

.hero {
  padding-top: 20px;
}

.eyebrow {
  text-shadow: 0 0 18px #57d8ff55;
}

h1 {
  text-wrap: balance;
}

.gradient {
  background-image: linear-gradient(
    105deg,
    #c5aaff 0%,
    #9e82ff 35%,
    #6bcfff 70%,
    #c5aaff 100%
  );
  background-size: 200% auto;
  animation: nexus-gradient-flow 8s ease-in-out infinite;
}

.search {
  background: #0e1020c9;
  border-color: #a477ff35;
  border-radius: 15px;
  box-shadow: 0 10px 35px #00000014;
  backdrop-filter: blur(12px);
}

.search:focus-within {
  border-color: var(--accent2);
  box-shadow: 0 0 0 3px #57d8ff12, 0 0 30px #a477ff19;
}

.btn {
  border-color: #a477ff55;
  background: linear-gradient(135deg, #a477ff19, #57d8ff08);
  transition:
    transform .2s ease,
    box-shadow .2s ease,
    border-color .2s ease,
    background .2s ease;
}

.btn:hover {
  border-color: var(--accent2);
  box-shadow: 0 0 20px #a477ff20;
}

.btn.primary {
  background: linear-gradient(115deg, #8b5cf6, #5b68ef 60%, #397fd9);
  box-shadow: 0 5px 20px #7255ff25, inset 0 1px #ffffff35;
}

.btn.primary:hover {
  box-shadow: 0 7px 27px #7255ff45, inset 0 1px #ffffff45;
}

.card,
.feature,
.panel,
.stat {
  border-color: #a477ff20;
  background: linear-gradient(145deg, #19182fdf, #0d1020ed);
  box-shadow: 0 8px 28px #00000015;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.card {
  border-radius: 15px;
  transition:
    transform .24s ease,
    border-color .24s ease,
    box-shadow .24s ease;
}

.card::after {
  opacity: .22;
  transition: opacity .25s ease;
}

.card:hover {
  transform: translateY(-5px);
  border-color: #a477ff88;
  box-shadow: 0 12px 35px #00000028, 0 0 24px #a477ff12;
}

.card:hover::after {
  opacity: .42;
}

.card-icon {
  border-color: #a477ff44;
  background: linear-gradient(135deg, #a477ff20, #57d8ff0d);
  box-shadow: inset 0 1px #ffffff0c;
}

.card-title {
  letter-spacing: .15px;
}

.feature,
.panel {
  border-radius: 16px;
  transition: border-color .22s ease, box-shadow .22s ease;
}

.feature:hover,
.panel:hover {
  border-color: #a477ff45;
  box-shadow: 0 10px 35px #00000018;
}

.field {
  background: #090b18;
  border-color: #a477ff30;
  transition: border-color .2s ease, box-shadow .2s ease;
}

.field:focus {
  border-color: var(--accent2);
  outline: none;
  box-shadow: 0 0 0 3px #57d8ff12;
}

.small-btn {
  transition: border-color .2s ease, background .2s ease;
}

.small-btn:hover {
  border-color: var(--accent2);
  background: #a477ff13;
}

.stat {
  border-radius: 14px;
}

.stat strong {
  color: var(--accent2);
  text-shadow: 0 0 22px #57d8ff20;
}

.modal {
  background: #101123f5;
  border-color: #a477ff55;
  box-shadow: 0 25px 100px #00000075, 0 0 45px #a477ff12;
  backdrop-filter: blur(20px);
}

#toast {
  background: #121329f5;
  border-color: #a477ff77;
  box-shadow: 0 10px 40px #00000045, 0 0 22px #a477ff12;
  backdrop-filter: blur(15px);
}

footer {
  letter-spacing: 1.5px;
}

body.light {
  color-scheme: light;
  background:
    radial-gradient(ellipse at 15% 15%, #a477ff20, transparent 38%),
    radial-gradient(ellipse at 85% 30%, #57d8ff18, transparent 38%),
    var(--bg);
  background-attachment: fixed;
}

body.light .sidebar {
  background: #f7f7ffed;
  box-shadow: 8px 0 35px #29305b0a;
}

body.light .card,
body.light .feature,
body.light .panel,
body.light .stat {
  background: linear-gradient(145deg, #ffffffed, #f6f5ffed);
  border-color: #8270bb30;
  box-shadow: 0 8px 28px #29305b0a;
}

body.light .search {
  background: #ffffffdc;
}

body.light .modal {
  background: #fffffffa;
}

body.light #toast {
  background: #fffffffa;
}

@keyframes nexus-grid-drift {
  from { background-position: 0 0; }
  to { background-position: 42px 42px; }
}

@keyframes nexus-mark-pulse {
  0%, 100% { box-shadow: 0 0 20px #8855ff30, inset 0 1px #ffffff50; }
  50% { box-shadow: 0 0 32px #8855ff58, inset 0 1px #ffffff60; }
}

@keyframes nexus-gradient-flow {
  0%, 100% { background-position: 0% center; }
  50% { background-position: 100% center; }
}

@media (max-width: 700px) {
  .topbar {
    padding-bottom: 12px;
  }

  .hero {
    padding-top: 12px;
  }

  .card:hover,
  .nav:hover {
    transform: none;
  }

  body::before {
    opacity: .14;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  body::before,
  .brand-mark,
  .gradient {
    animation: none !important;
  }
}


/* NEXUS COMMAND PALETTE 2.2 */
#nexusCommandOverlay[hidden] {
  display: none !important;
}

#nexusCommandOverlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: grid;
  place-items: start center;
  padding: min(15vh, 110px) 16px 20px;
  background: #03040bcc;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  animation: nexus-command-fade .16s ease both;
}

.nexus-command-box {
  width: min(600px, 100%);
  max-height: min(70vh, 620px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid #a477ff70;
  border-radius: 18px;
  background: linear-gradient(145deg, #17152cf7, #090b18f7);
  box-shadow: 0 30px 100px #0009, 0 0 45px #8955ff20;
  animation: nexus-command-rise .2s ease both;
}

.nexus-command-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px;
  border-bottom: 1px solid #a477ff28;
}

.nexus-command-symbol {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 38px;
  height: 38px;
  border: 1px solid #a477ff50;
  border-radius: 11px;
  color: #bda7ff;
  background: #a477ff17;
  font-size: 20px;
}

.nexus-command-search {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: #f2f0ff;
  font-size: 15px;
  padding: 8px 0;
}

.nexus-command-search::placeholder {
  color: #9290b0;
}

.nexus-command-esc {
  flex-shrink: 0;
  padding: 5px 8px;
  border: 1px solid #ffffff20;
  border-radius: 6px;
  color: #aaa7c6;
  font-size: 10px;
}

.nexus-command-label {
  padding: 15px 19px 8px;
  color: #8f8bab;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
}

.nexus-command-results {
  overflow-y: auto;
  padding: 4px 9px 12px;
}

.nexus-command-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 12px;
  margin: 2px 0;
  text-align: left;
  color: #e9e6ff;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 10px;
  transition: background .15s ease, border-color .15s ease;
}

.nexus-command-item:hover,
.nexus-command-item.is-selected {
  background: linear-gradient(90deg, #a477ff25, #57d8ff0c);
  border-color: #a477ff45;
}

.nexus-command-item.is-selected {
  box-shadow: inset 3px 0 #a477ff;
}

.nexus-command-item[hidden] {
  display: none !important;
}

.nexus-command-item .command-icon {
  display: grid;
  place-items: center;
  width: 35px;
  height: 35px;
  flex-shrink: 0;
  border-radius: 9px;
  background: #a477ff16;
  border: 1px solid #a477ff30;
  color: #bda7ff;
  font-size: 17px;
}

.nexus-command-item .command-copy {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 4px;
}

.nexus-command-item .command-name {
  font-size: 12px;
  font-weight: 700;
}

.nexus-command-item .command-description {
  color: #9996b4;
  font-size: 10px;
}

.nexus-command-item kbd {
  color: #a9a4c9;
  border: 1px solid #ffffff20;
  border-radius: 5px;
  padding: 3px 6px;
  font-size: 10px;
}

.nexus-command-empty {
  padding: 28px 12px;
  text-align: center;
  color: #9996b4;
  font-size: 12px;
}

.nexus-command-foot {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  padding: 12px 18px;
  border-top: 1px solid #a477ff25;
  color: #9692b0;
  font-size: 10px;
}

.nexus-command-foot strong {
  color: #c4b4ff;
  font-weight: 600;
}

@keyframes nexus-command-fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes nexus-command-rise {
  from { opacity: 0; transform: translateY(-8px) scale(.99); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (max-width: 600px) {
  #nexusCommandOverlay {
    padding: 8vh 10px 10px;
  }

  .nexus-command-head {
    padding: 13px;
    gap: 9px;
  }

  .nexus-command-item {
    padding: 10px;
  }

  .nexus-command-item kbd {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  #nexusCommandOverlay,
  .nexus-command-box {
    animation: none;
  }
}


/* NEXUS 3.0 Productivity Center */
.prod-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}
.prod-stat{display:flex;flex-direction:column;gap:8px}
.prod-stat>strong{font-size:30px;letter-spacing:-1px}
.prod-kicker{font-size:10px;font-weight:800;letter-spacing:1.5px;opacity:.7}
.prod-layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:18px 0}
.prod-section{min-width:0}
.prod-form{display:grid;gap:10px;margin:16px 0}
.prod-form .form-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.prod-form .field,.prod-filter .field{min-width:0;width:100%}
.prod-filter{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0}
.prod-filter .field{max-width:170px}
.prod-list{display:grid;gap:9px}
.prod-item{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--border);border-radius:13px;background:var(--surface,rgba(255,255,255,.025));min-width:0}
.prod-check{width:23px;height:23px;flex:0 0 23px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--accent);font-weight:900;cursor:pointer}
.prod-item-copy{flex:1;min-width:0}
.prod-item-copy>strong{display:block;overflow-wrap:anywhere;font-size:13px}
.prod-item.is-done .prod-item-copy>strong{text-decoration:line-through;opacity:.6}
.prod-item-meta{display:flex;align-items:center;gap:8px;margin-top:6px}
.prod-priority{font-size:10px;font-weight:750;padding:3px 7px;border-radius:20px;border:1px solid var(--border)}
.priority-high{color:#ff8585}
.priority-medium{color:#d8b2ff}
.priority-low{color:#83d8ae}
.prod-progress-head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px;font-size:13px}
.prod-progress-head strong{font-size:20px}
.prod-progress,.prod-timer-track{height:7px;border-radius:99px;overflow:hidden;background:var(--border)}
.prod-progress span,.prod-timer-track span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .25s ease}
.prod-planner{margin:18px 0}
.prod-planner-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.prod-planner-grid>div{display:flex;flex-direction:column;gap:9px;padding:14px;border:1px solid var(--border);border-radius:12px}
.prod-planner-grid strong{font-size:25px}
.prod-focus{margin:18px 0;text-align:center;padding:clamp(20px,4vw,38px)}
.prod-focus-top{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
.prod-mode{font-size:10px;font-weight:800;letter-spacing:1px;border:1px solid var(--border);border-radius:30px;padding:7px 10px}
.prod-focus h2{margin:24px 0 8px}
.prod-timer{font-size:clamp(48px,8vw,76px);font-weight:800;letter-spacing:-3px;font-variant-numeric:tabular-nums;margin:20px 0}
.prod-timer-track{max-width:440px;margin:0 auto 20px}
.prod-timer-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:9px}
.prod-timer-note{margin-top:18px;font-size:12px}
@media(max-width:760px){.prod-layout{grid-template-columns:1fr}.prod-stats{gap:8px}.prod-stat{padding:12px}.prod-stat>strong{font-size:24px}.prod-planner-grid{gap:8px}.prod-planner-grid>div{padding:10px}.prod-planner-grid strong{font-size:21px}}
@media(max-width:420px){.prod-form .form-row{grid-template-columns:1fr}.prod-filter{align-items:flex-start;flex-direction:column}.prod-filter .field{max-width:none}.prod-planner-grid{grid-template-columns:1fr}}


.note-list{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 18px}
.note-list button{max-width:100%;overflow-wrap:anywhere}
#siteSearch{max-width:100%;margin-bottom:18px}
.nexus-command-item[hidden]{display:none!important}
@media(max-width:700px){.note-list{gap:3px}.note-list button{font-size:10px}}
</style>

<script>
"use strict";
const $=id=>document.getElementById(id);
const read=(key,fallback)=>{try{const v=localStorage.getItem("nexus2_"+key);return v===null?fallback:JSON.parse(v)}catch{return fallback}};
const save=(key,value)=>localStorage.setItem("nexus2_"+key,JSON.stringify(value));
const defaults=[
{name:"Google",url:"https://www.google.com",icon:"G",desc:"Search anything"},
{name:"YouTube",url:"https://www.youtube.com",icon:"▶",desc:"Videos and creators"},
{name:"ChatGPT",url:"https://chatgpt.com",icon:"✳",desc:"Ideas and intelligence"},
{name:"GitHub",url:"https://github.com",icon:"⌘",desc:"Code and projects"},
{name:"Reddit",url:"https://www.reddit.com",icon:"r",desc:"Communities and discussions"},
{name:"Spotify",url:"https://open.spotify.com",icon:"♫",desc:"Music and playlists"},
{name:"Wikipedia",url:"https://www.wikipedia.org",icon:"W",desc:"Explore knowledge"},
{name:"Modrinth",url:"https://modrinth.com",icon:"◇",desc:"Minecraft mods"}
];
let sites=read("sites",defaults);
let bookmarks=read("bookmarks",[]);
let currentPage="home";
let toastTimer;

function toast(message){
  $("toast").textContent=message;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2600);
}
function updateClock(){
  const n=new Date();
  $("time").textContent=n.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
  $("date").textContent=n.toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"});
}
updateClock();setInterval(updateClock,1000);

function safeURL(value){
  try{
    let v=value.trim();
    if(!/^https?:\/\//i.test(v))v="https://"+v;
    const u=new URL(v);
    if(!["https:","http:"].includes(u.protocol)||!u.hostname.includes("."))return null;
    return u.href;
  }catch{return null}
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function openURL(url){
  const u=safeURL(url);
  if(!u){toast("Invalid website address.");return}
  window.open(u,"_blank","noopener,noreferrer");
}
function card(site,kind="site"){
  const index=kind==="bookmark"?bookmarks.findIndex(x=>x.url===site.url):sites.findIndex(x=>x.url===site.url);
  return `<article class="card">
    <div class="card-icon">${escapeHTML(site.icon||site.name?.[0]||"◈")}</div>
    <div class="card-title">${escapeHTML(site.name)}</div>
    <div class="card-desc">${escapeHTML(site.desc||new URL(site.url).hostname)}</div>
    <div class="card-actions">
      <button class="small-btn" data-open="${escapeHTML(site.url)}">Open ↗</button>
      ${kind==="site"?`<button class="small-btn" data-bookmark="${index}">☆ Save</button><button class="small-btn" data-remove-site="${index}" aria-label="Remove website">×</button>`:`<button class="small-btn" data-remove-bookmark="${index}">Remove</button>`}
    </div>
  </article>`;
}
function sectionHeading(title,description,button=""){
  return `<div class="heading"><div><h2>${title}</h2><p>${description}</p></div>${button}</div>`;
}
function pageIntro(title,description){
  return `<div class="page-intro"><div class="eyebrow">NEXUS / COMMAND CENTER</div><h1>${title}</h1><p class="sub">${description}</p></div>`;
}
function renderHome(){
  const widgets = read("dashboardWidgets", {
    clock: true, launch: true, recent: true
  });
  const recent = read("recentPages", []);
  const validRecent = Array.isArray(recent)
    ? recent.filter(p => Object.prototype.hasOwnProperty.call(titles, p)).slice(0, 5)
    : [];

  const toggle = (key, label) =>
    `<button type="button" class="nexus-dashboard-toggle"
      data-dashboard-toggle="${key}" aria-pressed="${widgets[key] !== false}">
      <span class="toggle-dot"></span>${label}
    </button>`;

  const clockCard = widgets.clock !== false ? `
    <article class="nexus-smart-card">
      <div class="nexus-smart-label">LOCAL TIME</div>
      <div id="nexusSmartClock" class="nexus-smart-time">--:--:--</div>
      <div id="nexusSmartDate" class="nexus-smart-date">Loading date...</div>
      <div class="nexus-smart-status">
        <span class="dot"></span> SYSTEM ONLINE
      </div>
    </article>` : "";

  const launchCard = widgets.launch !== false ? `
    <article class="nexus-smart-card">
      <div class="nexus-smart-label">QUICK LAUNCH</div>
      <div class="nexus-smart-shortcuts">
        <button class="nexus-smart-shortcut" data-go="websites" type="button">
          <span>◈</span><strong>Websites</strong>
        </button>
        <button class="nexus-smart-shortcut" data-go="tools" type="button">
          <span>⌘</span><strong>Tools</strong>
        </button>
        <button class="nexus-smart-shortcut" data-go="notes" type="button">
          <span>▤</span><strong>Notes</strong>
        </button>
        <button class="nexus-smart-shortcut" data-go="games" type="button">
          <span>✧</span><strong>Games</strong>
        </button>
      </div>
      <p class="nexus-smart-hint">Jump straight to your favorite NEXUS pages.</p>
    </article>` : "";

  const recentCard = widgets.recent !== false ? `
    <article class="nexus-smart-card">
      <div class="nexus-smart-label">RECENT PAGES</div>
      <div class="nexus-smart-recent">
        ${validRecent.length
          ? validRecent.map(p => `
            <button type="button" data-go="${p}">
              <span>${titles[p]}</span><small>Open ↗</small>
            </button>`).join("")
          : `<p class="sub">Your visited pages will appear here as you explore NEXUS.</p>`
        }
      </div>
    </article>` : "";

  return `<section class="hero">
    <div class="eyebrow">NEXUS 2.3 · SMART DASHBOARD</div>
    <h1>Your digital<br><span class="gradient">command center.</span></h1>
    <p class="sub">One space. Your tools, websites, ideas, and games — ready when you are.</p>
  </section>

  <div class="nexus-smart-grid">
    ${clockCard}
    ${launchCard}
    ${recentCard}
  </div>

  <section aria-label="Dashboard customization">
    <div class="heading">
      <div>
        <h2>Customize dashboard</h2>
        <p>Choose which cards appear on your Overview page.</p>
      </div>
    </div>
    <div class="nexus-dashboard-options">
      ${toggle("clock", "Live clock")}
      ${toggle("launch", "Quick launch")}
      ${toggle("recent", "Recent pages")}
    </div>
  </section>

  <form class="search" id="searchForm">
    <span class="glass">⌕</span>
    <input id="searchInput" placeholder="Search the web or enter a website..."
      autocomplete="off" aria-label="Search the web">
    <button class="btn primary">Search ↗</button>
  </form>

  ${sectionHeading("Your websites","Your internet, organized.",
    '<button class="btn" data-action="add-site">+ Add website</button>')}
  <div class="grid">${sites.map(s=>card(s)).join("")||
    '<div class="empty">No websites yet. Add one to get started.</div>'}</div>

  ${sectionHeading("Your command center","Your personal tools, all in one place.")}
  <div class="feature-grid">
    <article class="feature">
      <h3>▤ &nbsp; Personal notes</h3>
      <p>Save ideas, plans, and thoughts in your browser.</p>
      <button class="btn" data-go="notes">Open notes ↗</button>
    </article>
    <article class="feature">
      <h3>✧ &nbsp; Quick tools</h3>
      <p>Calculate expressions, generate random numbers, and test your luck.</p>
      <button class="btn" data-go="tools">Explore tools ↗</button>
    </article>
  </div>`;
}
function renderWebsites(){
  const query=String(read("launcherQuery","")).toLowerCase();
  const filtered=sites.filter(s=>(s.name+" "+s.url+" "+(s.desc||"")).toLowerCase().includes(query));
  return `${pageIntro("Your websites","Search, organize, and open your favorite websites.")}${sectionHeading("Website library",filtered.length+" of "+sites.length+" shortcuts",'<button class="btn primary" data-action="add-site">+ Add website</button>')}<input id="siteSearch" class="field" placeholder="Search your websites..." value="${escapeHTML(read("launcherQuery",""))}"><div class="grid">${filtered.map(s=>card(s)).join("")||'<div class="empty">No matching websites. Try another search.</div>'}</div>`;
}
function renderBookmarks(){
  return `${pageIntro("Your bookmarks","Your saved corners of the internet.")}${sectionHeading("Saved websites",bookmarks.length+" bookmarks")}<div class="grid">${bookmarks.map(s=>card(s,"bookmark")).join("")||'<div class="empty">No bookmarks yet.<br>Go to Websites and press ☆ Save on any website.</div>'}</div>`;
}
function nexusNotes(){
  let notes=read("notesV3",null);
  if(!Array.isArray(notes)){
    const old=read("notes","");
    notes=old.trim()?[{id:"legacy-"+Date.now(),title:"My original notes",body:old,updated:Date.now()}]:[];
    save("notesV3",notes);
  }
  return notes;
}
function renderNotes(){
  const notes=nexusNotes();
  const active=notes[0]||{id:"",title:"",body:""};
  return `${pageIntro("Notes 2.0","A personal notebook with multiple locally saved notes.")}
  <section class="panel">
    <div class="form-row" style="justify-content:space-between;align-items:center">
      <h3>▤ &nbsp; My notebook</h3>
      <button class="btn primary" data-action="new-note">+ New note</button>
    </div>
    <div class="note-list">${notes.map(n=>`<button class="small-btn" style="margin:4px" data-note-select="${escapeHTML(n.id)}">${escapeHTML(n.title||"Untitled note")}</button>`).join("")}</div>
    ${notes.length?`<input id="noteId" type="hidden" value="${escapeHTML(active.id)}">
      <input id="noteTitle" class="field" maxlength="100" value="${escapeHTML(active.title)}" placeholder="Note title">
      <textarea id="notesArea" class="field" placeholder="Write your ideas, plans, or reminders...">${escapeHTML(active.body||"")}</textarea>
      <button class="btn primary" data-action="save-notes">Save note</button>
      <button class="btn danger" data-action="delete-note">Delete note</button>
      <span id="noteStatus" class="sub"></span>`:`<div class="empty">Your notebook is empty. Create your first note.</div>`}
    <p class="sub">Your original notes are preserved. Notes stay in this browser profile.</p>
  </section>`;
}
function renderStatistics(){
  const tasks=prodTasks();
  const goals=prodGoals();
  const notes=nexusNotes();
  const recent=read("recentPages",[]);
  const done=tasks.filter(t=>t.done).length;
  const open=tasks.length-done;
  const goalsDone=goals.filter(g=>g.done).length;
  const metrics=[
    ["Websites",sites.length,"Saved shortcuts"],
    ["Bookmarks",bookmarks.length,"Saved bookmarks"],
    ["Notes",notes.length,"Notebook entries"],
    ["Tasks",tasks.length,"Total tasks"],
    ["Completed",done,"Finished tasks"],
    ["Goals",goals.length,"Daily goals"]
  ];
  return `${pageIntro("Statistics Center","A live overview calculated from your saved NEXUS data.")}
    <div class="stats">${metrics.map(m=>`<div class="stat"><strong>${m[1]}</strong><span>${m[0]} · ${m[2]}</span></div>`).join("")}</div>
    <section class="panel"><h3>Productivity overview</h3>
      <p class="sub">Open tasks: <strong>${open}</strong></p>
      <p class="sub">Completed daily goals: <strong>${goalsDone}</strong> / ${goals.length}</p>
      <p class="sub">Recent pages recorded: <strong>${Array.isArray(recent)?recent.length:0}</strong></p>
      <p class="sub">These figures come from your browser's saved NEXUS data. No activity is uploaded.</p>
    </section>`;
}
function renderTools(){
  return `${pageIntro("Quick tools","Simple utilities built directly into NEXUS.")}
  <div class="feature-grid">

function prodTodayKey(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function prodTasks(){
  const value = read("productivityTasks", []);
  return Array.isArray(value) ? value : [];
}
function prodGoals(){
  const value = read("dailyGoals", []);
  return Array.isArray(value) ? value : [];
}
function prodTimerState(){
  const value = read("productivityTimer", null);
  if(value && ["focus","break"].includes(value.mode) &&
     Number.isFinite(value.remaining) && value.remaining >= 0){
    return value;
  }
  return {mode:"focus",remaining:1500,running:false,endAt:null};
}
function prodFormatTime(seconds){
  seconds = Math.max(0, Math.ceil(seconds));
  return String(Math.floor(seconds/60)).padStart(2,"0")+":"+
         String(seconds%60).padStart(2,"0");
}
function prodTimerRemaining(timer){
  return timer.running && timer.endAt
    ? Math.max(0, Math.ceil((timer.endAt-Date.now())/1000))
    : timer.remaining;
}

function updateProductivityTimer(){
  let timer = prodTimerState();
  if(timer.running){
    timer.remaining = prodTimerRemaining(timer);
    if(timer.remaining<=0){
      timer.running = false;
      timer.endAt = null;
      timer.mode = timer.mode==="focus" ? "break" : "focus";
      timer.remaining = timer.mode==="focus" ? 1500 : 300;
      save("productivityTimer",timer);
      toast(timer.mode==="break" ? "Focus session complete. Time for a break!" : "Break complete. Ready to focus!");
    } else {
      save("productivityTimer",timer);
    }
  }
  const display = $("prodTimerDisplay");
  if(!display)return;
  const length = timer.mode==="focus" ? 1500 : 300;
  display.textContent = prodFormatTime(timer.remaining);
  const mode = $("prodTimerMode");
  if(mode)mode.textContent = timer.mode==="focus" ? "FOCUS SESSION" : "SHORT BREAK";
  const toggle = $("prodTimerToggle");
  if(toggle)toggle.textContent = timer.running ? "Pause timer" : "Start timer";
  const track = display.parentElement.querySelector(".prod-timer-track span");
  if(track)track.style.width=Math.max(0,Math.min(100,timer.remaining/length*100))+"%";
}

function guessNumber(){
  const input=$("guessInput"),message=$("guessMessage");if(!input||!message)return;
  const value=Number(input.value);
  if(!Number.isInteger(value)||value<1||value>100){message.textContent="Enter a whole number from 1 to 100.";return}
  if(!target)startGuessGame();

function displayTimer(){const el=$("timerDisplay");if(el)el.textContent=String(Math.floor(timerSeconds/60)).padStart(2,"0")+":"+String(timerSeconds%60).padStart(2,"0")}
function toggleTimer(){

  timerInterval=setInterval(()=>{

function exportData(){
  const storage={};
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    if(key&&key.startsWith("nexus2_"))storage[key]=localStorage.getItem(key);
  }
  const data={format:"NEXUS_FULL_BACKUP",version:3,exportedAt:new Date().toISOString(),storage};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="nexus-3-backup.json";a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast("Full NEXUS backup exported.");
}
function importBackupFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(String(reader.result||""));
      if(data.format!=="NEXUS_FULL_BACKUP"||data.version!==3||!data.storage||typeof data.storage!=="object"||Array.isArray(data.storage)){
        throw new Error("This is not a supported NEXUS 3 backup.");
      }
      const entries=Object.entries(data.storage);
      if(!entries.length||entries.some(([k,v])=>!/^nexus2_[a-zA-Z0-9_-]+$/.test(k)||typeof v!=="string")){
        throw new Error("The backup contains invalid storage entries.");
      }
      if(!confirm("Import "+entries.length+" saved data items? Existing NEXUS data with matching keys will be replaced."))return;
      entries.forEach(([k,v])=>localStorage.setItem(k,v));
      toast("Backup imported. Reloading NEXUS...");
      setTimeout(()=>location.reload(),700);
    }catch(err){alert("Import failed: "+err.message);}
  };
  reader.onerror=()=>alert("Could not read that backup file.");
  reader.readAsText(file);
}
document.addEventListener("change",event=>{

(function initNexusCommandPalette() {
  const overlay = $("nexusCommandOverlay");

  const empty = $("nexusCommandEmpty");

  if (!overlay || !search || !results || !empty) return;

  let previouslyFocused = null;

  function visibleItems() {
    return [...results.querySelectorAll("[data-command-page], [data-command-action]")]
      .filter(item => !item.hidden);
  }

  function selectItem(index) {
    const items = visibleItems();
    if (!items.length) {
      selectedIndex = 0;
      return;
    }

    selectedIndex = (index + items.length) % items.length;

    items.forEach((item, i) => {
      const selected = i === selectedIndex;
      item.classList.toggle("is-selected", selected);
      item.setAttribute("aria-selected", String(selected));
    });

    items[selectedIndex].scrollIntoView({ block: "nearest" });
  }

  function filterItems() {
    const query = search.value.trim().toLowerCase();

    results.querySelectorAll("[data-command-page], [data-command-action]").forEach(item => {
      const text = (
        item.dataset.search + " " + item.textContent
      ).toLowerCase();

      item.hidden = !text.includes(query);
    });

    const items = visibleItems();
    empty.hidden = items.length !== 0;
    selectItem(0);
  }

  function openPalette() {
    if (!overlay.hidden) {
      search.focus();
      return;
    }

    previouslyFocused = document.activeElement;
    overlay.hidden = false;
    search.value = "";
    filterItems();

    requestAnimationFrame(() => search.focus());
  }

  function closePalette() {
    if (overlay.hidden) return;

    overlay.hidden = true;

    if (previouslyFocused && previouslyFocused.isConnected) {
      previouslyFocused.focus();
    }
  }

  function executeSelected() {
    const item = visibleItems()[selectedIndex];
    if (!item) return;

    const page = item.dataset.commandPage;
    const action = item.dataset.commandAction;
    closePalette();
    if(action==="export"){exportData();return;}
    if(page)navigate(page);
  }

  search.addEventListener("input", filterItems);

  search.addEventListener("keydown", event => {
    if (event.key === "ArrowDown") {
      event.preventDefault();
      selectItem(selectedIndex + 1);
    } else if (event.key === "ArrowUp") {
      event.preventDefault();
      selectItem(selectedIndex - 1);
    } else if (event.key === "Enter") {
      event.preventDefault();
      executeSelected();
    } else if (event.key === "Escape") {
      event.preventDefault();
      closePalette();
    }
  });

  results.addEventListener("click", event => {
    const item = event.target.closest("[data-command-page]");
    if (!item || item.hidden) return;

    selectedIndex = visibleItems().indexOf(item);
    executeSelected();
  });

  overlay.addEventListener("click", event => {
    if (event.target === overlay) closePalette();
  });

  document.addEventListener("keydown", event => {
    const key = event.key.toLowerCase();

    if ((event.ctrlKey || event.metaKey) && key === "k") {
      event.preventDefault();
      openPalette();
    } else if (event.key === "Escape" && !overlay.hidden) {
      closePalette();
    }
  });
})();


// NEXUS SMART DASHBOARD 2.3
function trackNexusRecentPage(page) {
  if (!Object.prototype.hasOwnProperty.call(titles, page)) return;

  let recent = read("recentPages", []);
  if (!Array.isArray(recent)) recent = [];

  recent = [page, ...recent.filter(p => p !== page)]
    .filter(p => Object.prototype.hasOwnProperty.call(titles, p))
    .slice(0, 5);

  save("recentPages", recent);
}

function updateNexusSmartClock() {
  const clock = $("nexusSmartClock");
  const date = $("nexusSmartDate");
  if (!clock && !date) return;

  const now = new Date();

  if (clock) {
    clock.textContent = new Intl.DateTimeFormat(undefined, {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    }).format(now);
  }

  if (date) {
    date.textContent = new Intl.DateTimeFormat(undefined, {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    }).format(now);
  }
}

updateNexusSmartClock();
setInterval(updateNexusSmartClock, 1000);

$("content").addEventListener("click", event => {
  const button = event.target.closest("[data-dashboard-toggle]");
  if (!button) return;

  const key = button.dataset.dashboardToggle;
  if (!["clock", "launch", "recent"].includes(key)) return;

  const preferences = read("dashboardWidgets", {
    clock: true, launch: true, recent: true
  });

  preferences[key] = preferences[key] === false;
  save("dashboardWidgets", preferences);
  navigate("home");
  toast("Dashboard preferences saved.");
});


// NEXUS 3.0 Productivity interactions
$("content").addEventListener("submit", event => {
  if(event.target.id==="prodTaskForm"){
    event.preventDefault();
    const input=$("prodTaskInput");
    const text=input.value.trim();
    if(!text)return;
    const priority=$("prodTaskPriority").value;
    const tasks=prodTasks();
    tasks.unshift({id:String(Date.now())+"-"+Math.random().toString(36).slice(2,7),text,priority,done:false,created:prodTodayKey()});
    save("productivityTasks",tasks);
    navigate("productivity");
    toast("Task added.");
  } else if(event.target.id==="prodGoalForm"){
    event.preventDefault();
    const input=$("prodGoalInput");
    const text=input.value.trim();
    if(!text)return;
    const goals=prodGoals();
    goals.unshift({id:String(Date.now())+"-"+Math.random().toString(36).slice(2,7),text,done:false,date:prodTodayKey()});
    save("dailyGoals",goals);
    navigate("productivity");
    toast("Daily goal added.");
  }
});

$("content").addEventListener("change", event => {
  if(event.target.id==="prodTaskFilter"){
    save("taskFilter",event.target.value);
    navigate("productivity");
  }
});

$("content").addEventListener("click", event => {
  const button=event.target.closest("[data-prod-action]");
  if(!button)return;
  const action=button.dataset.prodAction;
  const id=button.dataset.id;

  if(action==="task-toggle" || action==="task-delete"){
    const tasks=prodTasks();
    const task=tasks.find(t=>String(t.id)===String(id));
    if(!task)return;
    if(action==="task-toggle")task.done=!task.done;
    else {
      if(!confirm("Delete this task?"))return;
      save("productivityTasks",tasks.filter(t=>String(t.id)!==String(id)));
      navigate("productivity");toast("Task deleted.");return;
    }
    save("productivityTasks",tasks);
    navigate("productivity");
    return;
  }

  if(action==="goal-toggle" || action==="goal-delete"){
    const goals=prodGoals();
    const goal=goals.find(g=>String(g.id)===String(id));
    if(!goal)return;
    if(action==="goal-toggle")goal.done=!goal.done;
    else {
      if(!confirm("Delete this daily goal?"))return;
      save("dailyGoals",goals.filter(g=>String(g.id)!==String(id)));
      navigate("productivity");toast("Daily goal deleted.");return;
    }
    save("dailyGoals",goals);
    navigate("productivity");
    return;
  }

  let timer=prodTimerState();
  if(action==="timer-toggle"){
    if(timer.running){
      timer.remaining=prodTimerRemaining(timer);
      timer.running=false;
      timer.endAt=null;
      toast("Focus timer paused.");
    }else{
      if(timer.remaining<=0)timer.remaining=timer.mode==="focus"?1500:300;
      timer.endAt=Date.now()+timer.remaining*1000;
      timer.running=true;
      toast("Focus timer started.");
    }
  }else if(action==="timer-reset"){
    timer.running=false;timer.endAt=null;
    timer.remaining=timer.mode==="focus"?1500:300;
  }else if(action==="timer-focus"){
    timer.mode="focus";timer.remaining=1500;timer.running=false;timer.endAt=null;
  }else if(action==="timer-break"){
    timer.mode="break";timer.remaining=300;timer.running=false;timer.endAt=null;
  }else{
    return;
  }
  save("productivityTimer",timer);
  updateProductivityTimer();
  navigate("productivity");
});

// The countdown continues while navigating between NEXUS pages.
setInterval(updateProductivityTimer,1000);


applyPreferences();
navigate("home");
</script>
